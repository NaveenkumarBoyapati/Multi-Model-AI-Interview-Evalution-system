<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role | AI Interview</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/role.css?v=2">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Select Your Interview Role</h1>

        <p>Choose the position you want to practice.</p>

    </div>

    <div class="roles">

        <div class="role-card" data-role="Java Developer">
            <i class="fa-brands fa-java"></i>
            <h2>Java Developer</h2>
            <p>OOP • Spring • JDBC</p>
        </div>

        <div class="role-card" data-role="Python Developer">
            <i class="fa-brands fa-python"></i>
            <h2>Python Developer</h2>
            <p>Python • AI • Django</p>
        </div>

        <div class="role-card" data-role="Data Analyst">
            <i class="fas fa-chart-line"></i>
            <h2>Data Analyst</h2>
            <p>SQL • Excel • Power BI</p>
        </div>

        <div class="role-card" data-role="Web Developer">
            <i class="fas fa-code"></i>
            <h2>Web Developer</h2>
            <p>HTML • CSS • JavaScript</p>
        </div>

    </div>

    <button id="continueBtn" disabled>
        Continue
        <i class="fas fa-arrow-right"></i>
    </button>

</div>

<script src="js/role.js?v=2"></script>

</body>

</html>
