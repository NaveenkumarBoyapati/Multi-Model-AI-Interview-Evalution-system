<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview Instructions</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/instructions.css?v=2">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="instruction-box">

        <div class="icon">

            <i class="fas fa-clipboard-list"></i>

        </div>

        <h1>Interview Instructions</h1>

        <p>Please read all instructions carefully before starting your AI interview.</p>

        <div class="instructions">

            <div class="item">
                <i class="fas fa-video"></i>
                <span>Allow Camera Access</span>
            </div>

            <div class="item">
                <i class="fas fa-microphone"></i>
                <span>Allow Microphone Access</span>
            </div>

            <div class="item">
                <i class="fas fa-clock"></i>
                <span>Interview Duration: 40 Minutes</span>
            </div>

            <div class="item">
                <i class="fas fa-circle-question"></i>
                <span>10 Technical Questions</span>
            </div>

            <div class="item">
                <i class="fas fa-desktop"></i>
                <span>Do Not Switch Tabs During Interview</span>
            </div>

            <div class="item">
                <i class="fas fa-wifi"></i>
                <span>Ensure Stable Internet Connection</span>
            </div>

        </div>

        <button id="startBtn">

            Start Interview

            <i class="fas fa-arrow-right"></i>

        </button>

    </div>

</div>

<script src="js/instructions.js?v=2"></script>

</body>

</html>
