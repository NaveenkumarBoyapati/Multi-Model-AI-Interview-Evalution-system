<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | AI Interview System</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/change_password.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .pwd-rules {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 12px;
        }

        .pwd-rules-title {
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .pwd-rule-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            margin-bottom: 4px;
            transition: color 0.2s;
        }

        .pwd-rule-item.valid {
            color: #16a34a;
            font-weight: 500;
        }

        .pwd-rule-item .icon {
            font-size: 12px;
            width: 14px;
            text-align: center;
        }

        .auth-alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            line-height: 1.4;
        }

        .auth-alert.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .auth-alert.success {
            display: block;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Multi-model AI Interview Evaluation System</h1>

    <div class="password-box">

        <h2>Change Password</h2>

        <div id="alertBox" class="auth-alert"></div>

        <form id="changePasswordForm" onsubmit="return handleChangePassword(event);">

            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" placeholder="Enter current password" autocomplete="current-password" required>

            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" required>

            <!-- Real-time Password Rules Checklist -->
            <div class="pwd-rules" id="pwdRulesBox">
                <div class="pwd-rules-title">Password Requirements:</div>
                <div class="pwd-rule-item" id="ruleMinLength">
                    <span class="icon"><i class="fas fa-circle-xmark"></i></span>
                    <span>Minimum 8 characters</span>
                </div>
                <div class="pwd-rule-item" id="ruleFirstUpper">
                    <span class="icon"><i class="fas fa-circle-xmark"></i></span>
                    <span>First character must be uppercase letter (A-Z)</span>
                </div>
                <div class="pwd-rule-item" id="ruleSpecialChar">
                    <span class="icon"><i class="fas fa-circle-xmark"></i></span>
                    <span>At least one special character (@, #, $, !, etc.)</span>
                </div>
            </div>

            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" required>

            <button type="submit" id="submitBtn">
                <i class="fas fa-key"></i> Update Password
            </button>

        </form>

        <div style="margin-top: 18px; text-align: center;">
            <a href="dashboard.html" style="color: #2563eb; text-decoration: none; font-size: 14px; font-weight: 500;">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

    </div>

</div>

<script>
    const SPECIAL_CHARS_REGEX = /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?/~`'"\\]/;

    // Ensure user has active session
    const token = localStorage.getItem("sessionToken") || sessionStorage.getItem("sessionToken");
    if (!token) {
        window.location.replace("login.html?auth_msg=login_required");
    }

    // Live validation
    const newPasswordInput = document.getElementById("newPassword");
    const ruleMinLength = document.getElementById("ruleMinLength");
    const ruleFirstUpper = document.getElementById("ruleFirstUpper");
    const ruleSpecialChar = document.getElementById("ruleSpecialChar");

    if (newPasswordInput) {
        newPasswordInput.addEventListener("input", function () {
            const val = this.value || "";
            updateRuleUI(ruleMinLength, val.length >= 8);
            updateRuleUI(ruleFirstUpper, val.length > 0 && val[0] >= "A" && val[0] <= "Z");
            updateRuleUI(ruleSpecialChar, SPECIAL_CHARS_REGEX.test(val));
        });
    }

    function updateRuleUI(elem, isValid) {
        if (!elem) return;
        const icon = elem.querySelector(".icon i");
        if (isValid) {
            elem.classList.add("valid");
            if (icon) {
                icon.className = "fas fa-circle-check";
                icon.style.color = "#16a34a";
            }
        } else {
            elem.classList.remove("valid");
            if (icon) {
                icon.className = "fas fa-circle-xmark";
                icon.style.color = "#94a3b8";
            }
        }
    }

    async function handleChangePassword(e) {
        if (e && e.preventDefault) e.preventDefault();

        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const submitBtn = document.getElementById("submitBtn");
        const alertBox = document.getElementById("alertBox");

        alertBox.style.display = "none";

        if (newPassword.length < 8) {
            alertBox.className = "auth-alert error";
            alertBox.textContent = "New password must be at least 8 characters long.";
            alertBox.style.display = "block";
            return false;
        }

        if (!(newPassword[0] >= "A" && newPassword[0] <= "Z")) {
            alertBox.className = "auth-alert error";
            alertBox.textContent = "The first character of the new password must be an uppercase English letter (A-Z).";
            alertBox.style.display = "block";
            return false;
        }

        if (!SPECIAL_CHARS_REGEX.test(newPassword)) {
            alertBox.className = "auth-alert error";
            alertBox.textContent = "New password must contain at least one special character (@, #, $, !, etc.).";
            alertBox.style.display = "block";
            return false;
        }

        if (newPassword !== confirmPassword) {
            alertBox.className = "auth-alert error";
            alertBox.textContent = "New passwords do not match.";
            alertBox.style.display = "block";
            return false;
        }

        try {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

            const res = await fetch("/api/auth/change-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    current_password: currentPassword,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });

            const data = await res.json();

            if (!res.ok) {
                alertBox.className = "auth-alert error";
                alertBox.textContent = data.detail || data.message || "Failed to update password.";
                alertBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-key"></i> Update Password';
                return false;
            }

            alertBox.className = "auth-alert success";
            alertBox.textContent = "Password updated successfully! Redirecting to dashboard...";
            alertBox.style.display = "block";

            setTimeout(() => {
                const isAdmin = localStorage.getItem("isAdmin") === "true" || localStorage.getItem("userRole") === "Admin";
                window.location.href = isAdmin ? "admin_dashboard.html" : "dashboard.html";
            }, 1500);

        } catch (err) {
            console.error("Change password error:", err);
            alertBox.className = "auth-alert error";
            alertBox.textContent = "Error connecting to the server.";
            alertBox.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-key"></i> Update Password';
        }

        return false;
    }
</script>

</body>

</html>
