<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AI Interview System</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 460px;
            padding: 36px 32px;
        }

        .auth-card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-card-header .icon-badge {
            width: 54px;
            height: 54px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 14px auto;
        }

        .auth-card-header h1 {
            font-size: 22px;
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .auth-card-header p {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        .dev-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 12px;
            color: #334155;
            word-break: break-all;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2563eb;
            font-size: 13px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="auth-card-header">
        <div class="icon-badge">
            <i class="fas fa-key"></i>
        </div>
        <h1>Reset Your Password</h1>
        <p>Enter the email address associated with your account and we will generate a single-use password reset link.</p>
    </div>

    <div id="alertBox" class="auth-alert"></div>

    <form id="forgotForm" onsubmit="return handleForgotPassword(event);">

        <label for="email">Registered Email</label>
        <input
            type="email"
            id="email"
            placeholder="e.g. candidate@example.com"
            autocomplete="email"
            required>

        <button type="submit" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>

    </form>

    <div id="devNoticeBox" style="display: none;"></div>

    <div style="text-align: center;">
        <a href="login.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

</div>

<script>
    async function handleForgotPassword(e) {
        if (e && e.preventDefault) e.preventDefault();

        const emailInput = document.getElementById("email");
        const submitBtn = document.getElementById("submitBtn");
        const alertBox = document.getElementById("alertBox");
        const devNoticeBox = document.getElementById("devNoticeBox");

        const email = emailInput ? emailInput.value.trim() : "";

        if (!email) {
            alertBox.className = "auth-alert error";
            alertBox.textContent = "Please enter your email address.";
            alertBox.style.display = "block";
            return false;
        }

        try {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            alertBox.style.display = "none";
            devNoticeBox.style.display = "none";

            const res = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            });

            const data = await res.json();
            const deliveryStatus = data.delivery_status || (data.status === "error" ? "smtp_error" : "unconfigured");

            if (deliveryStatus === "sent") {
                // delivery_status === "sent"
                // -> Show green success message
                // -> Do NOT show reset link or dev notice box
                alertBox.className = "auth-alert success";
                alertBox.innerHTML = '<i class="fas fa-check-circle"></i> Password reset link sent successfully. Please check your email inbox and spam folder.';
                alertBox.style.display = "block";
                devNoticeBox.style.display = "none";
                devNoticeBox.innerHTML = "";
                emailInput.value = "";
            } else if (deliveryStatus === "smtp_error") {
                // delivery_status === "smtp_error"
                // -> Show clear error message
                alertBox.className = "auth-alert error";
                alertBox.innerHTML = '<i class="fas fa-circle-exclamation"></i> We couldn\'t send the reset email. Please try again later.';
                alertBox.style.display = "block";
                devNoticeBox.style.display = "none";
                devNoticeBox.innerHTML = "";
            } else if (deliveryStatus === "unconfigured") {
                // delivery_status === "unconfigured"
                // -> Only then show local-development fallback notice and reset-link option
                alertBox.className = "auth-alert info";
                alertBox.innerHTML = '<i class="fas fa-info-circle"></i> If this email address is registered in our system, you will receive single-use password reset instructions shortly.';
                alertBox.style.display = "block";

                if (data.reset_link) {
                    devNoticeBox.className = "dev-box";
                    devNoticeBox.innerHTML = `
                        <strong><i class="fas fa-info-circle" style="color: #2563eb;"></i> Local Development Fallback (SMTP Not Configured):</strong><br>
                        <span>${data.dev_notice || 'Reset link generated for local testing:'}</span><br>
                        <a href="${data.reset_link}" style="color: #2563eb; font-weight: 600; word-break: break-all; margin-top: 6px; display: inline-block;">
                            👉 Click here to proceed to Reset Password Page
                        </a>
                    `;
                    devNoticeBox.style.display = "block";
                } else if (data.instructions) {
                    devNoticeBox.className = "dev-box";
                    devNoticeBox.innerHTML = `
                        <strong><i class="fas fa-circle-exclamation" style="color: #f59e0b;"></i> SMTP Configuration Notice:</strong><br>
                        ${data.instructions}
                    `;
                    devNoticeBox.style.display = "block";
                } else {
                    devNoticeBox.style.display = "none";
                    devNoticeBox.innerHTML = "";
                }
            } else {
                alertBox.className = "auth-alert info";
                alertBox.textContent = data.message || "Password reset instructions processed.";
                alertBox.style.display = "block";
                devNoticeBox.style.display = "none";
                devNoticeBox.innerHTML = "";
            }

        } catch (err) {
            console.error("Forgot password error:", err);
            alertBox.className = "auth-alert error";
            alertBox.textContent = "Unable to process request. Please ensure the backend is running.";
            alertBox.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
        }

        return false;
    }
</script>

</body>

</html>
